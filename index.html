<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DocuSwift Scan</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}

canvas{
    max-width:100%;
    height:auto;
    background:white;
}

textarea{
    color:#000000 !important;
    background:#ffffff !important;
    font-size:16px;
    line-height:1.6;
}

button{
    transition:0.2s;
}

button:active{
    transform:scale(.97);
}

#status{
    display:none;
}
</style>
</head>

<body class="p-4">

<div class="max-w-3xl mx-auto">

<h1 class="text-4xl font-bold text-center mb-2">
DocuSwift Scan
</h1>

<p class="text-center text-gray-300 mb-6">
Scan, Extract and Convert Documents Securely
</p>

<div class="card text-center">

<input
type="file"
id="fileInput"
accept="image/*"
class="mb-4 w-full">

<canvas
id="canvas"
class="w-full rounded-lg">
</canvas>

</div>

<div class="card">

<h2 class="text-xl font-bold mb-4">
Image Controls
</h2>

<label>Brightness</label>

<input
type="range"
id="brightness"
min="50"
max="200"
value="100"
class="w-full">

<div class="flex justify-between text-sm text-gray-400">
<span>50</span>
<span id="brightnessValue">100</span>
<span>200</span>
</div>

<label class="mt-4 block">
Contrast
</label>

<input
type="range"
id="contrast"
min="50"
max="200"
value="100"
class="w-full">

<div class="flex justify-between text-sm text-gray-400">
<span>50</span>
<span id="contrastValue">100</span>
<span>200</span>
</div>

<button
id="applyFilter"
class="bg-blue-600 px-4 py-3 rounded-lg mt-5 w-full">
Apply Filter
</button>

<button
id="grayBtn"
class="bg-gray-600 px-4 py-3 rounded-lg mt-3 w-full">
Grayscale
</button>

<button
id="bwBtn"
class="bg-black border border-gray-500 px-4 py-3 rounded-lg mt-3 w-full">
Black & White
</button>

<button
id="resetBtn"
class="bg-orange-600 px-4 py-3 rounded-lg mt-3 w-full">
Reset Image
</button>

</div>

<div class="card">

<h2 class="text-xl font-bold mb-3">
OCR Text
</h2>

<button
id="extractText"
class="bg-green-600 px-4 py-3 rounded-lg w-full">
Extract Text
</button>

<div
id="status"
class="text-center mt-4 text-yellow-300">
Reading document... Please wait
</div>

<textarea
id="ocrResult"
rows="10"
class="w-full mt-4 p-3 rounded-lg"
placeholder="Extracted text will appear here...">
</textarea>

<button
id="copyText"
class="bg-purple-600 px-4 py-3 rounded-lg mt-4 w-full">
Copy Text
</button>

<button
id="pdfBtn"
class="bg-red-600 px-4 py-3 rounded-lg mt-3 w-full">
Download PDF
</button>

</div>

</div>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const fileInput =
document.getElementById("fileInput");

const brightness =
document.getElementById("brightness");

const contrast =
document.getElementById("contrast");

const brightnessValue =
document.getElementById("brightnessValue");

const contrastValue =
document.getElementById("contrastValue");

let originalImage = null;


/* IMAGE UPLOAD */

fileInput.addEventListener("change",function(e){

const file =
e.target.files[0];

if(!file)return;

const img =
new Image();

img.onload=function(){

originalImage=img;

canvas.width=img.width;
canvas.height=img.height;

ctx.drawImage(
img,
0,
0
);

brightness.value=100;
contrast.value=100;

brightnessValue.textContent="100";
contrastValue.textContent="100";

};

img.src =
URL.createObjectURL(file);

});


/* SLIDERS */

brightness.addEventListener(
"input",
function(){

brightnessValue.textContent =
brightness.value;

});

contrast.addEventListener(
"input",
function(){

contrastValue.textContent =
contrast.value;

});


/* APPLY FILTER */

document.getElementById(
"applyFilter"
).onclick=function(){

if(!originalImage){

alert(
"Please upload an image first."
);

return;

}

ctx.filter =
`brightness(${brightness.value}%)
contrast(${contrast.value}%)`;

ctx.drawImage(
originalImage,
0,
0,
canvas.width,
canvas.height
);

ctx.filter="none";

};


/* GRAYSCALE */

document.getElementById(
"grayBtn"
).onclick=function(){

if(!originalImage){

alert(
"Please upload an image first."
);

return;

}

ctx.drawImage(
originalImage,
0,
0,
canvas.width,
canvas.height
);

const imageData =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data =
imageData.data;

for(
let i=0;
i<data.length;
i+=4
){

const gray =
0.299*data[i]+
0.587*data[i+1]+
0.114*data[i+2];

data[i]=gray;
data[i+1]=gray;
data[i+2]=gray;

}

ctx.putImageData(
imageData,
0,
0
);

};


/* BLACK AND WHITE */

document.getElementById(
"bwBtn"
).onclick=function(){

if(!originalImage){

alert(
"Please upload an image first."
);

return;

}

ctx.drawImage(
originalImage,
0,
0,
canvas.width,
canvas.height
);

const imageData =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data =
imageData.data;

for(
let i=0;
i<data.length;
i+=4
){

const gray =
0.299*data[i]+
0.587*data[i+1]+
0.114*data[i+2];

const value =
gray>128 ? 255 : 0;

data[i]=value;
data[i+1]=value;
data[i+2]=value;

}

ctx.putImageData(
imageData,
0,
0
);

};


/* RESET */

document.getElementById(
"resetBtn"
).onclick=function(){

if(!originalImage)return;

canvas.width =
originalImage.width;

canvas.height =
originalImage.height;

ctx.filter="none";

ctx.drawImage(
originalImage,
0,
0
);

brightness.value=100;
contrast.value=100;

brightnessValue.textContent="100";
contrastValue.textContent="100";

};


/* OCR */

document.getElementById(
"extractText"
).onclick=async function(){

if(canvas.width===0){

alert(
"Please upload an image first."
);

return;

}

const status =
document.getElementById("status");

const result =
document.getElementById("ocrResult");

status.style.display="block";

status.textContent =
"Reading document...";

result.value =
"Reading text...";

try{

const output =
await Tesseract.recognize(
canvas.toDataURL("image/png"),
"eng",
{

logger:function(info){

if(info.status){

status.textContent =
info.status+
" "+
Math.round(
(info.progress||0)*100
)+
"%";

}

}

}
);

result.value =
output.data.text.trim();

status.textContent =
"Text extraction completed.";

}

catch(error){

console.error(error);

result.value =
"Unable to read this document.";

status.textContent =
"OCR failed.";

}

};


/* COPY */

document.getElementById(
"copyText"
).onclick=async function(){

const text =
document.getElementById(
"ocrResult"
).value;

if(!text){

alert(
"There is no text to copy."
);

return;

}

try{

await navigator.clipboard.writeText(
text
);

alert(
"Text Copied!"
);

}

catch(error){

alert(
"Copy failed."
);

}

};


/* PDF */

document.getElementById(
"pdfBtn"
).onclick=function(){

if(canvas.width===0){

alert(
"Please upload an image first."
);

return;

}

const {
jsPDF
} =
window.jspdf;

const pdf =
new jsPDF({

orientation:
canvas.width >
canvas.height
? "landscape"
: "portrait"

});

const imgData =
canvas.toDataURL(
"image/jpeg",
0.95
);

const pageWidth =
pdf.internal.pageSize.getWidth();

const pageHeight =
pdf.internal.pageSize.getHeight();

const ratio =
Math.min(

(pageWidth-20) /
canvas.width,

(pageHeight-20) /
canvas.height

);

const width =
canvas.width*ratio;

const height =
canvas.height*ratio;

pdf.addImage(

imgData,

"JPEG",

(pageWidth-width)/2,

10,

width,

height

);

pdf.save(
"DocuSwift-Scan.pdf"
);

};

</script>

</body>
</html>
