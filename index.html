<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanX Pro - Instant Document Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: white; font-family: sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="p-4 md:p-10">

    <main class="max-w-xl mx-auto">
        <!-- Header -->
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-400">ScanX Pro</h1>

        <!-- Upload Section -->
        <div class="glass p-6 rounded-2xl mb-8 cursor-pointer hover:border-blue-500 border-2 border-dashed border-gray-600 transition-all text-center" 
             onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <p class="text-lg">Click here to upload document</p>
            <p class="text-sm text-gray-400 mt-2">Supports JPG, PNG, WEBP</p>
        </div>

        <!-- Output Section -->
        <div id="outputContainer" class="glass p-6 rounded-2xl hidden">
            <h2 class="text-xl mb-4 text-gray-300">Processed Output</h2>
            <canvas id="canvasOutput" class="w-full rounded-lg mb-4"></canvas>
            <button id="downloadBtn" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-bold">
                Download Result
            </button>
        </div>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const canvasOutput = document.getElementById('canvasOutput');
        const outputContainer = document.getElementById('outputContainer');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvasOutput.width = img.width;
                    canvasOutput.height = img.height;
                    const ctx = canvasOutput.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    outputContainer.classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'scanned-document.png';
            link.href = canvasOutput.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
